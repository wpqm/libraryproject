<!DOCTYPE html>
<html>
<head>
    <title>Book Detail</title>
</head>
<body>
    {% if book %}
        <h1>{{ book.title }}</h1>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p><strong>ID:</strong> {{ book.id }}</p>
    {% else %}
        <h1>Book not found</h1>
    {% endif %}
</body>
</html>
